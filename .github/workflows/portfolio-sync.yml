name: Daily Portfolio Sync

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies 🔧
        run: npm install axios @supabase/supabase-js

      - name: Run Sync Script 🔄
        run: node --dns-result-order=ipv4first scripts/syncRepos.js
        env:
          SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
