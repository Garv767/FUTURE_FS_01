name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Debug Secrets 🔍
        run: |
          echo "Checking REACT_APP_SUPABASE_URL length: ${#REACT_APP_SUPABASE_URL}"
          echo "Checking REACT_APP_SUPABASE_ANON_KEY length: ${#REACT_APP_SUPABASE_ANON_KEY}"
          if [ -z "$REACT_APP_SUPABASE_URL" ]; then echo "⚠️ URL IS EMPTY!"; fi
          if [ -z "$REACT_APP_SUPABASE_ANON_KEY" ]; then echo "⚠️ ANON KEY IS EMPTY!"; fi
        env:
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ vars.REACT_APP_SUPABASE_ANON_KEY }}

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ vars.REACT_APP_SUPABASE_ANON_KEY }}
          # Ensure Node uses the correct homepage for public assets
          PUBLIC_URL: /portfolio

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
